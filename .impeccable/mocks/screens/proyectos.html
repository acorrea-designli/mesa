<style>

[data-v]{display:none}
body[data-view="desk"] [data-v="desk"],body[data-view="spur"] [data-v="spur"],body[data-view="prospec"] [data-v="prospec"],body[data-view="empty"] [data-v="empty"],body[data-view="limit"] [data-v="limit"],body[data-view="phone"] [data-v="phone"]{display:block}

/* app frame and rail */
.app{width:1440px;height:900px;background:var(--gnd);display:grid;grid-template-columns:184px 1fr;overflow:hidden}
.rail{background:var(--deep);border-right:1px solid var(--rule);padding:22px 14px;display:flex;flex-direction:column;gap:3px}

.nav b{font-weight:600;font-size:13px;color:var(--mute)}
.nav.on{background:var(--raise);color:var(--ink);border-left-color:var(--ink)}
.nav.on b{color:var(--ink)}
.nav.foot{margin-top:auto;color:var(--mute)}
.rl-health{margin-top:auto;padding:12px 10px 10px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:7px}

.ln{display:inline-block;width:16px;height:5px;border-radius:3px;background:var(--ink);flex:none}
.ln.gh{background:var(--gh)}.ln.sl{background:var(--sl)}.ln.cl{background:var(--cl)}.ln.bc{background:var(--bc)}.ln.ca{background:var(--ca)}

.head{display:flex;align-items:center;gap:14px;padding:20px 28px 0;height:62px}

.tab b{font-weight:600;color:var(--mute)}

.btn{height:40px;padding:0 16px;border-radius:6px;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;border:1px solid var(--edge);color:var(--ink);white-space:nowrap}
.btn.p{background:var(--ink);color:var(--gnd);border-color:var(--ink)}

.st{height:24px;padding:0 8px;border-radius:4px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border:1px solid var(--edge);color:var(--ink);white-space:nowrap}

.lk{height:22px;padding:0 7px;border:1px solid var(--edge);border-radius:4px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;color:var(--ink);background:var(--raise);white-space:nowrap}

.lk small{font-weight:500;color:var(--mute);font-size:12px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--mute);white-space:nowrap}

.more{height:34px;border:1px dashed var(--edge);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:var(--ink2);margin-top:8px}

.sv-ln{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.s-gh{stroke:var(--gh)}.s-ink{stroke:var(--ink)}

.sv-cap{fill:var(--gnd);stroke:var(--ink);stroke-width:2.5}
.sv-cap.on{fill:var(--raise);stroke-width:3.5}

.a-band{padding:14px 28px 0;position:relative}
.a-band svg{overflow:visible}
.a-sel{display:flex;align-items:center;gap:12px;padding:4px 28px 10px;border-bottom:1px solid var(--rule)}
.a-sel h2{font-size:16px;font-weight:700;white-space:nowrap}
.a-sel>span{font-size:13px;color:var(--mute);white-space:nowrap}
.a-sel .tabs{margin-left:auto;display:flex;gap:6px}

.a-grid{display:grid;grid-template-columns:minmax(0,1fr) 112px 130px 158px 196px 108px;column-gap:14px;align-items:center}
.a-cols{height:32px;align-items:flex-end;padding-bottom:6px}

.a-iss .bst.none{border-style:dashed;border-width:1.5px;color:var(--ink2)}
.a-pr{height:50px;border-bottom:1px solid var(--rule2)}
.a-pr.sel{background:var(--raise);border-radius:6px;border-bottom-color:transparent;box-shadow:0 0 0 1px var(--rule)}
.a-who{display:flex;align-items:center;min-width:0;padding-left:30px;position:relative;height:100%}
.a-who::before{content:"";position:absolute;left:7px;top:-6px;bottom:24px;width:2px;background:var(--rule)}
.a-who::after{content:"";position:absolute;left:7px;top:24px;width:14px;height:2px;background:var(--rule)}
.subj{min-width:0}
.subj b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subj small{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tags{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;min-width:0}
.rv{font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.rv.ch{color:var(--ink);font-weight:700}
.grp{display:flex;align-items:center;gap:10px;height:40px;margin-top:6px;font-size:13px;font-weight:700;color:var(--ink2)}
.grp small{font-size:12.5px;font-weight:600;color:var(--mute)}
.grp .rule{flex:1;height:1px;background:var(--rule)}
.train{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:14px;min-height:58px;border:1px dashed var(--edge);border-radius:6px;padding:8px 14px;margin-top:6px}
.train .subj b{font-size:14px}
.train .tags{gap:8px}
.empty{margin:26px 28px 0;padding:22px 24px;border:1px solid var(--rule);border-radius:8px;background:var(--raise);display:grid;grid-template-columns:44px 1fr;column-gap:16px;row-gap:6px;max-width:760px}

/* ---------- phone ---------- */
.ph-stage{display:flex;gap:40px;justify-content:center;padding:28px 28px 34px;background:var(--deep)}
.ph-col{display:flex;flex-direction:column;gap:12px;align-items:center}

.quote{margin-top:8px;font-size:13px;line-height:1.5;color:var(--ink2);border-left:2px solid var(--rule);padding-left:12px}
.quote code{font-size:12px;font-family:ui-monospace,monospace;color:var(--ink)}
.route{margin-top:8px;background:var(--raise);border:1px solid var(--rule);border-radius:6px;padding:4px 14px}

.ph-dock .btn.p{height:56px;font-size:17px}
.ph-dock .two{display:flex;gap:8px}
.ph-dock .two .btn{flex:1}

// cfg: {W, L, lines:{repo:y}, st:[{k,x,c,none}], order:{station:[issue...]}, prs, sel, spur:{label,y}, train, dash, empty}
function band(cfg){
 const {W,L,lines,st,order,prs,sel}=cfg;const H=cfg.H||232;const spurY=cfg.spurY||196;
 let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" font-family="Hanken Grotesk" role="img" aria-label="Línea del proyecto">';
 for(const [r,y] of Object.entries(lines))s+='<text x="0" y="'+(y+4)+'" font-size="12.5" font-weight="600" class="sv-mute">'+r+'</text>';
 const dash=cfg.dash?' sv-dash':'';
 s+='<g class="sv-ln'+(cfg.empty?' dimmed':'')+'" style="stroke-width:5">';
 for(const y of Object.values(lines))s+='<path d="M'+L+' '+y+'H'+W+'" class="s-gh'+dash+'"/>';
 s+='</g>';
 // the spur: PRs with no issue on the board, branching off the lowest line
 const lastY=Math.max(...Object.values(lines));
 const loose=prs.filter(p=>!p.i&&!p.train);
 if(loose.length&&!cfg.empty){
  const end=L+60+loose.length*24+10;const on=sel==="spur";
  s+='<g'+(on?'':' class="dimmed"')+'><path d="M'+(L+10)+' '+lastY+'l'+(spurY-lastY)+' '+(spurY-lastY)+'H'+end+'" class="sv-ln s-gh'+dash+'" style="stroke-width:5"/>';
  let sx=L+60;loose.forEach(p=>{s+='<circle cx="'+sx+'" cy="'+spurY+'" r="5" class="sv-tick'+(p.st==="rev"||p.st==="mine"?' you':'')+'"/>';sx+=24;});
  s+='<text x="'+(end+14)+'" y="'+(spurY+4)+'" font-size="13" font-weight="700" class="sv-txt">Sin issue</text><text x="'+(end+80)+'" y="'+(spurY+4)+'" font-size="12.5" font-weight="600" class="sv-mute">'+cfg.spurNote+'</text></g>';}
 // the release train: develop to staging, one dashed track
 if(cfg.train){const tr=prs.filter(p=>p.train);const y=spurY;const x0=cfg.trainX;
  s+='<path d="M'+x0+' '+lastY+'l'+(y-lastY)+' '+(y-lastY)+'H'+(x0+200)+'" class="sv-ln s-gh" style="stroke-width:5;stroke-dasharray:10 7;stroke-linecap:butt"/>';
  tr.forEach((p,k)=>{s+='<circle cx="'+(x0+(y-lastY)+30+k*24)+'" cy="'+y+'" r="5" class="sv-tick"/>';});
  s+='<text x="'+(x0+214)+'" y="'+(y+4)+'" font-size="13" font-weight="700" class="sv-txt">Tren a staging</text><text x="'+(x0+322)+'" y="'+(y+4)+'" font-size="12.5" font-weight="600" class="sv-mute">'+tr.length+' PRs «Create staging PR», una por repo</text>';}
 // stations
 for(const t of st){
  const on=t.k===sel;const quiet=!on&&t.quiet;
  s+='<text x="'+t.x+'" y="20" font-size="15" font-weight="700" class="sv-txt"'+(quiet?' opacity=".6"':'')+'>'+t.k+'</text>';
  s+='<text x="'+t.x+'" y="38" font-size="12.5" font-weight="600" class="sv-mute">'+t.c+'</text>';
  const top=Math.min(...Object.values(lines))-18,hgt=lastY-top+18;
  s+='<rect x="'+t.x+'" y="'+top+'" width="22" height="'+hgt+'" rx="11" class="sv-cap'+(on?' on':'')+'"'+(t.none?' stroke-dasharray="4 4"':'')+'/>';
  if(on)s+='<path d="M'+(t.x-4)+' '+(top+hgt+12)+'h30" class="sv-ln s-ink" style="stroke-width:3"/>';}
 // issues: a stop per issue after its station; PRs are ticks on their repo's line
 const groups={};for(const p of prs)if(p.i)(groups[p.i]=groups[p.i]||[]).push(p);
 for(const [stk,list] of Object.entries(order)){
  const t=st.find(x=>x.k===stk);let x=t.x+50;const dim=stk!==sel;
  s+='<g'+(dim?' class="dimmed"':'')+'>';
  for(const n of list){
   const ps=groups[n],repos=[...new Set(ps.map(p=>p.r))];
   const byRepo={};ps.forEach(p=>(byRepo[p.r]=byRepo[p.r]||[]).push(p));
   const multi=repos.length>1;
   if(multi){const ys=repos.map(r=>lines[r]);s+='<path d="M'+x+' '+Math.min(...ys)+'V'+Math.max(...ys)+'" class="sv-ln s-ink" style="stroke-width:3"/>';}
   for(const r of repos){byRepo[r].forEach((p,k)=>{const cx=x+k*16,cy=lines[r];
    if(multi&&k===0)s+='<circle cx="'+cx+'" cy="'+cy+'" r="7" class="sv-ring"/>';
    else s+='<circle cx="'+cx+'" cy="'+cy+'" r="5" class="sv-tick'+(p.draft?' draft':'')+'"/>';
    if(p.st==="blk")s+='<path d="M'+(cx-5)+' '+(cy-13)+'h10" class="sv-ln s-ink" style="stroke-width:2.5"/>';});}
   s+='<text x="'+(x-8)+'" y="'+(lastY+30)+'" font-size="12" font-weight="700" class="sv-txt">'+(cfg.pre||'')+n+'</text>';
   x+=Math.max(...repos.map(r=>byRepo[r].length))*16+56;}
  s+='</g>';}
 // legend
 if(cfg.legend!==false)s+='<g transform="translate('+(W-372)+','+(H-6)+')" font-size="12" font-weight="600" class="sv-mute"><circle cx="5" cy="-4" r="5" class="sv-tick"/><text x="16" y="0">PR</text><circle cx="50" cy="-4" r="5" class="sv-tick you"/><text x="61" y="0">te toca</text><circle cx="124" cy="-4" r="6" class="sv-ring"/><text x="136" y="0">issue en 2 repos</text><path d="M252 -12h10" class="sv-ln s-ink" style="stroke-width:2.5"/><text x="268" y="0">bloqueante</text></g>';
 return s+'</svg>';}
